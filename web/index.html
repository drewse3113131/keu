<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UC License Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-[#07090e] text-slate-100 min-h-screen antialiased selection:bg-sky-500 selection:text-white pb-20">

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-emerald-500 text-white px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3 font-bold text-sm">
        <i class="fa-solid fa-circle-check text-lg"></i> <span id="toast-msg">Готово!</span>
    </div>

    <!-- Header -->
    <header class="border-b border-slate-800/80 bg-slate-900/60 backdrop-blur-xl sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-sky-500 via-indigo-600 to-purple-600 flex items-center justify-center shadow-xl shadow-sky-500/20 text-white font-black text-xl">
                    UC
                </div>
                <div>
                    <span class="font-extrabold text-lg tracking-tight text-white block">UC License Center</span>
                    <span class="text-xs text-slate-400 font-medium">Админ-панель управления ключами</span>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <span class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 shadow-sm">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Сервер активен
                </span>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 pt-10">

        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            <div class="relative overflow-hidden bg-slate-900/80 border border-slate-800/80 p-6 rounded-3xl shadow-xl backdrop-blur-md group hover:border-sky-500/50 transition-all">
                <div class="absolute -right-6 -bottom-6 w-28 h-28 bg-sky-500/10 rounded-full blur-2xl group-hover:bg-sky-500/20 transition-all"></div>
                <div class="flex items-center justify-between relative z-10">
                    <div>
                        <p class="text-slate-400 text-xs font-bold uppercase tracking-wider">Всего ключей</p>
                        <h3 class="text-4xl font-black text-white mt-2" id="stat-total">0</h3>
                    </div>
                    <div class="w-14 h-14 bg-sky-500/10 text-sky-400 rounded-2xl flex items-center justify-center text-2xl border border-sky-500/20">
                        <i class="fa-solid fa-key"></i>
                    </div>
                </div>
            </div>

            <div class="relative overflow-hidden bg-slate-900/80 border border-slate-800/80 p-6 rounded-3xl shadow-xl backdrop-blur-md group hover:border-emerald-500/50 transition-all">
                <div class="absolute -right-6 -bottom-6 w-28 h-28 bg-emerald-500/10 rounded-full blur-2xl group-hover:bg-emerald-500/20 transition-all"></div>
                <div class="flex items-center justify-between relative z-10">
                    <div>
                        <p class="text-slate-400 text-xs font-bold uppercase tracking-wider">Свободных</p>
                        <h3 class="text-4xl font-black text-emerald-400 mt-2" id="stat-free">0</h3>
                    </div>
                    <div class="w-14 h-14 bg-emerald-500/10 text-emerald-400 rounded-2xl flex items-center justify-center text-2xl border border-emerald-500/20">
                        <i class="fa-solid fa-lock-open"></i>
                    </div>
                </div>
            </div>

            <div class="relative overflow-hidden bg-slate-900/80 border border-slate-800/80 p-6 rounded-3xl shadow-xl backdrop-blur-md group hover:border-indigo-500/50 transition-all">
                <div class="absolute -right-6 -bottom-6 w-28 h-28 bg-indigo-500/10 rounded-full blur-2xl group-hover:bg-indigo-500/20 transition-all"></div>
                <div class="flex items-center justify-between relative z-10">
                    <div>
                        <p class="text-slate-400 text-xs font-bold uppercase tracking-wider">Активированных</p>
                        <h3 class="text-4xl font-black text-indigo-400 mt-2" id="stat-used">0</h3>
                    </div>
                    <div class="w-14 h-14 bg-indigo-500/10 text-indigo-400 rounded-2xl flex items-center justify-center text-2xl border border-indigo-500/20">
                        <i class="fa-solid fa-shield-check"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Generator Panel -->
        <div class="bg-gradient-to-r from-slate-900 via-slate-900 to-slate-800/90 border border-slate-800/80 p-8 rounded-3xl shadow-2xl mb-10 flex flex-col md:flex-row items-center justify-between gap-6 backdrop-blur-xl">
            <div>
                <h2 class="text-xl font-bold text-white flex items-center gap-3">
                    <i class="fa-solid fa-wand-magic-sparkles text-sky-400"></i> Генератор лицензий
                </h2>
                <p class="text-slate-400 text-sm mt-1">Создавайте новые ключи формата <code class="text-sky-300 font-mono">UC-XXXX</code>.</p>
            </div>
            <form id="genForm" class="flex items-center gap-4 w-full md:w-auto">
                <div class="flex flex-col">
                    <label class="text-xs text-slate-400 font-semibold mb-1">Срок действия:</label>
                    <select name="days" class="bg-slate-950 border border-slate-700 text-white font-medium px-4 py-3 rounded-2xl focus:outline-none focus:border-sky-500 transition-all">
                        <option value="1">1 день (Тест)</option>
                        <option value="7">7 дней (Неделя)</option>
                        <option value="30" selected>30 дней (Месяц)</option>
                        <option value="90">90 дней (3 месяца)</option>
                        <option value="365">365 дней (Год)</option>
                        <option value="0">Бессрочно</option>
                    </select>
                </div>
                <button type="submit" class="mt-5 bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-400 hover:to-indigo-500 text-white font-bold px-8 py-3.5 rounded-2xl shadow-xl shadow-sky-500/25 transition-all transform hover:-translate-y-0.5 active:translate-y-0 flex items-center gap-2 whitespace-nowrap">
                    <i class="fa-solid fa-plus"></i> Создать ключ
                </button>
            </form>
        </div>

        <!-- Search Bar -->
        <div class="mb-6 flex items-center justify-between gap-4">
            <div class="relative w-full max-w-md">
                <span class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-slate-500">
                    <i class="fa-solid fa-search"></i>
                </span>
                <input type="text" id="searchInput" onkeyup="filterKeys()" placeholder="Поиск по ключу или HWID..." class="w-full bg-slate-900 border border-slate-800 text-slate-200 pl-11 pr-4 py-3 rounded-2xl focus:outline-none focus:border-sky-500 text-sm shadow-inner transition-all">
            </div>
        </div>

        <!-- Keys Table -->
        <div class="bg-slate-900/90 border border-slate-800/80 rounded-3xl shadow-2xl overflow-hidden backdrop-blur-xl">
            <div class="p-6 px-8 border-b border-slate-800/80 flex items-center justify-between">
                <h3 class="font-bold text-lg text-white flex items-center gap-2.5">
                    <i class="fa-solid fa-database text-sky-400"></i> База ключей
                </h3>
                <span class="text-xs text-slate-400 bg-slate-800/80 px-3.5 py-1.5 rounded-xl font-mono border border-slate-700/50" id="total-count">Всего: 0</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse" id="keysTable">
                    <thead>
                        <tr class="bg-slate-950/50 text-slate-400 text-xs font-bold uppercase tracking-wider border-b border-slate-800/80">
                            <th class="py-4 px-6">#</th>
                            <th class="py-4 px-6">Лицензионный ключ</th>
                            <th class="py-4 px-6">Срок / Осталось</th>
                            <th class="py-4 px-6">Статус</th>
                            <th class="py-4 px-6">Привязка (HWID)</th>
                            <th class="py-4 px-6">Создан</th>
                            <th class="py-4 px-6 text-right">Управление</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-800/50" id="keysBody"></tbody>
                </table>
            </div>
        </div>

    </main>

    <script>
        // --- Toast ---
        const toastEl = document.getElementById('toast'), toastMsg = document.getElementById('toast-msg');
        function showToast(msg) {
            toastMsg.textContent = msg;
            toastEl.classList.remove('translate-y-20','opacity-0');
            setTimeout(() => toastEl.classList.add('translate-y-20','opacity-0'), 2500);
        }

        // --- Copy Key ---
        function copyKey(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast("Скопирован: " + text);
            });
        }

        // --- Search Filter ---
        function filterKeys() {
            const filter = document.getElementById('searchInput').value.toUpperCase();
            document.querySelectorAll('#keysBody tr').forEach(tr => {
                const keyText = tr.cells[1].innerText.toUpperCase();
                const hwidText = tr.cells[4].innerText.toUpperCase();
                tr.style.display = (keyText.includes(filter) || hwidText.includes(filter)) ? '' : 'none';
            });
        }

        // --- API Helpers ---
        async function apiPost(url, formData) {
            const res = await fetch(url, { method: 'POST', body: formData });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.json();
        }

        // --- Load Keys ---
        async function loadKeys() {
            try {
                const res = await fetch('/admin/keys');
                const keys = await res.json();
                const tbody = document.getElementById('keysBody');
                tbody.innerHTML = '';
                let total = 0, free = 0;

                keys.forEach(k => {
                    total++;
                    if (k.used === 0) free++;

                    const daysText = k.days === 0 ? 'Бессрочно' : `${k.days} дн.`;
                    const expiresHtml = k.expires_at && k.expires_at !== 'Бессрочно' 
                        ? `<div class="text-xs text-slate-500 mt-0.5">До: ${k.expires_at}</div>` 
                        : '';

                    const statusHtml = k.used === 1
                        ? `<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-indigo-500/10 text-indigo-400 border border-indigo-500/20"><span class="w-2 h-2 rounded-full bg-indigo-400 animate-pulse"></span> Активирован</span>`
                        : `<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20"><span class="w-2 h-2 rounded-full bg-emerald-400"></span> Свободен</span>`;

                    const hwidDisplay = k.hwid || '— не привязан —';

                    // Формы теперь с data-id для JS обработки
                    const actionsHtml = `
                        <div class="flex items-center justify-end gap-2">
                            ${k.used === 1 ? `
                            <form class="action-form" data-action="reset" data-id="${k.id}" style="margin:0;">
                                <button type="submit" class="bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/20 p-2.5 rounded-xl text-xs font-semibold transition-all flex items-center justify-center shadow-md" title="Сбросить HWID привязку">
                                    <i class="fa-solid fa-rotate-left"></i>
                                </button>
                            </form>` : ''}
                            <form class="action-form" data-action="delete" data-id="${k.id}" style="margin:0;">
                                <button type="submit" class="bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20 p-2.5 rounded-xl text-xs font-semibold transition-all flex items-center justify-center shadow-md" title="Удалить ключ">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </form>
                        </div>
                    `;

                    document.getElementById('keysBody').innerHTML += `
                        <tr id="row-${k.id}" class="hover:bg-slate-800/40 transition-colors group">
                            <td class="py-4 px-6 text-slate-500 font-mono text-xs">#${k.id}</td>
                            <td class="py-4 px-6">
                                <button onclick="copyKey('${k.key}')" class="inline-flex items-center gap-2.5 bg-slate-950 hover:bg-slate-900 border border-slate-800 hover:border-sky-500/50 px-3.5 py-2 rounded-xl text-sky-300 font-mono font-bold shadow-inner transition-all" title="Нажмите, чтобы скопировать">
                                    <span>${k.key}</span>
                                    <i class="fa-regular fa-copy text-slate-500 hover:text-sky-400 transition-colors"></i>
                                </button>
                            </td>
                            <td class="py-4 px-6 text-sm text-slate-300">
                                <span class="font-medium">${k.days === 0 ? 'Бессрочно' : k.days + ' дн.'}</span>
                                ${k.expires_at && k.expires_at !== 'Бессрочно' ? `<div class="text-xs text-slate-500 mt-0.5">До: ${k.expires_at}</div>` : ''}
                            </td>
                            <td class="py-4 px-6">${k.used === 1 
                                ? `<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-indigo-500/10 text-indigo-400 border border-indigo-500/20"><span class="w-2 h-2 rounded-full bg-indigo-400 animate-pulse"></span> Активирован</span>`
                                : `<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20"><span class="w-2 h-2 rounded-full bg-emerald-400"></span> Свободен</span>`}
                            </td>
                            <td class="py-4 px-6 font-mono text-xs text-slate-400 max-w-[180px] truncate" title="${k.hwid}">${k.hwid || '—'}</td>
                            <td class="py-4 px-6 text-slate-400 text-xs">${k.created_at}</td>
                            <td class="py-4 px-6 text-right">${k.used === 1 ? `
                            <form class="action-form" data-action="reset" data-id="${k.id}" style="margin:0;">
                                <button type="submit" class="bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/20 p-2.5 rounded-xl text-xs font-semibold transition-all flex items-center justify-center shadow-md" title="Сбросить HWID привязку">
                                    <i class="fa-solid fa-rotate-left"></i>
                                </button>
                            </form>` : ''}
                            <form class="action-form" data-action="delete" data-id="${k.id}" style="margin:0;">
                                <button type="submit" class="bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20 p-2.5 rounded-xl text-xs font-semibold transition-all flex items-center justify-center shadow-md" title="Удалить ключ">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </form>
                            </td>
                        </tr>
                    `;
                });

                document.getElementById('stat-total').innerText = total;
                document.getElementById('stat-free').innerText = free;
                document.getElementById('stat-used').innerText = total - free;
                document.getElementById('total-count').innerText = `Всего: ${total}`;

                // Вешаем обработчики на новые формы
                attachFormHandlers();
            } catch (e) {
                console.error(e);
            }
        }

        // --- Attach Form Handlers ---
        function attachFormHandlers() {
            document.querySelectorAll('.action-form').forEach(form => {
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const action = form.dataset.action;
                    const id = form.dataset.id;
                    const url = `/admin/${action}/${id}`;
                    
                    try {
                        const res = await fetch(url, { method: 'POST' });
                        if (!res.ok) throw new Error(`HTTP ${res.status}`);
                        
                        if (action === 'delete') {
                            // Удаляем строку из DOM
                            document.getElementById(`row-${id}`).remove();
                            showToast('Ключ удален');
                            // Обновляем счетчики
                            const totalEl = document.getElementById('stat-total');
                            const freeEl = document.getElementById('stat-free');
                            const usedEl = document.getElementById('stat-used');
                            const totalCountEl = document.getElementById('total-count');
                            if (totalEl) {
                                const t = parseInt(totalEl.innerText) - 1;
                                totalEl.innerText = t;
                                totalCountEl.innerText = `Всего: ${t}`;
                                // Примечание: не знаем был ли ключ free/used, проще перезагрузить счетчики через loadKeys() или просто уменьшить total
                            }
                        } else if (action === 'reset') {
                            showToast('HWID сброшен');
                        }
                        // Просто перезагружаем таблицу для гарантии актуальности счетчиков и статусов
                        loadKeys();
                    } catch (err) {
                        console.error(err);
                        showToast('Ошибка: ' + err.message);
                    }
                });
            });
        }

        // --- Toast ---
        const toastEl = document.getElementById('toast'), toastMsg = document.getElementById('toast-msg');
        function showToast(msg) {
            toastMsg.textContent = msg;
            toastEl.classList.remove('translate-y-20','opacity-0');
            setTimeout(() => toastEl.classList.add('translate-y-20','opacity-0'), 2500);
        }

        // --- Copy Key ---
        function copyKey(text) {
            navigator.clipboard.writeText(text).then(() => showToast("Скопирован: " + text));
        }

        // --- Search Filter ---
        function filterKeys() {
            const filter = document.getElementById('searchInput').value.toUpperCase();
            document.querySelectorAll('#keysBody tr').forEach(tr => {
                const keyText = tr.cells[1].innerText.toUpperCase();
                const hwidText = tr.cells[4].innerText.toUpperCase();
                tr.style.display = (keyText.includes(filter) || hwidText.includes(filter)) ? '' : 'none';
            });
        }

        // --- Load Keys ---
        async function loadKeys() {
            try {
                const res = await fetch('/admin/keys');
                const keys = await res.json();
                const tbody = document.getElementById('keysBody');
                tbody.innerHTML = '';
                let total = 0, free = 0;

                keys.forEach(k => {
                    total++;
                    if (k.used === 0) free++;

                    const daysText = k.days === 0 ? 'Бессрочно' : `${k.days} дн.`;
                    const expiresHtml = k.expires_at && k.expires_at !== 'Бессрочно' 
                        ? `<div class="text-xs text-slate-500 mt-0.5">До: ${k.expires_at}</div>` 
                        : '';

                    const statusHtml = k.used === 1
                        ? `<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-indigo-500/10 text-indigo-400 border border-indigo-500/20"><span class="w-2 h-2 rounded-full bg-indigo-400 animate-pulse"></span> Активирован</span>`
                        : `<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20"><span class="w-2 h-2 rounded-full bg-emerald-400"></span> Свободен</span>`;

                    const hwidDisplay = k.hwid || '— не привязан —';

                    const actionsHtml = `
                        <div class="flex items-center justify-end gap-2">
                            ${k.used === 1 ? `
                            <form class="action-form" data-action="reset" data-id="${k.id}" style="margin:0;">
                                <button type="submit" class="bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/20 p-2.5 rounded-xl text-xs font-semibold transition-all flex items-center justify-center shadow-md" title="Сбросить HWID привязку">
                                    <i class="fa-solid fa-rotate-left"></i>
                                </button>
                            </form>` : ''}
                            <form class="action-form" data-action="delete" data-id="${k.id}" style="margin:0;">
                                <button type="submit" class="bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20 p-2.5 rounded-xl text-xs font-semibold transition-all flex items-center justify-center shadow-md" title="Удалить ключ">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </form>
                        </div>
                    `;

                    document.getElementById('keysBody').innerHTML += `
                        <tr id="row-${k.id}" class="hover:bg-slate-800/40 transition-colors group">
                            <td class="py-4 px-6 text-slate-500 font-mono text-xs">#${k.id}</td>
                            <td class="py-4 px-6">
                                <button onclick="copyKey('${k.key}')" class="inline-flex items-center gap-2.5 bg-slate-950 hover:bg-slate-900 border border-slate-800 hover:border-sky-500/50 px-3.5 py-2 rounded-xl text-sky-300 font-mono font-bold shadow-inner transition-all" title="Нажмите, чтобы скопировать">
                                    <span>${k.key}</span>
                                    <i class="fa-regular fa-copy text-slate-500 hover:text-sky-400 transition-colors"></i>
                                </button>
                            </td>
                            <td class="py-4 px-6 text-sm text-slate-300">
                                <span class="font-medium">${k.days === 0 ? 'Бессрочно' : k.days + ' дн.'}</span>
                                ${k.expires_at && k.expires_at !== 'Бессрочно' ? `<div class="text-xs text-slate-500 mt-0.5">До: ${k.expires_at}</div>` : ''}
                            </td>
                            <td class="py-4 px-6">${k.used === 1 
                                ? `<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-indigo-500/10 text-indigo-400 border border-indigo-500/20"><span class="w-2 h-2 rounded-full bg-indigo-400 animate-pulse"></span> Активирован</span>`
                                : `<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20"><span class="w-2 h-2 rounded-full bg-emerald-400"></span> Свободен</span>`}
                            </td>
                            <td class="py-4 px-6 font-mono text-xs text-slate-400 max-w-[180px] truncate" title="${k.hwid}">${k.hwid || '—'}</td>
                            <td class="py-4 px-6 text-slate-400 text-xs">${k.created_at}</td>
                            <td class="py-4 px-6 text-right">${actionsHtml}</td>
                        </tr>
                    `;
                });

                document.getElementById('stat-total').innerText = total;
                document.getElementById('stat-free').innerText = free;
                document.getElementById('stat-used').innerText = total - free;
                document.getElementById('total-count').innerText = `Всего: ${total}`;

                attachFormHandlers();
            } catch (e) {
                console.error(e);
            }
        }

        // --- Generate Key ---
        document.getElementById('genForm').addEventListener('submit', async e => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const res = await fetch('/admin/generate', { method: 'POST', body: formData });
            const json = await res.json();
            showToast('Создан ключ: ' + json.key);
            loadKeys();
        });

        // --- Toast ---
        const toastEl = document.getElementById('toast'), toastMsg = document.getElementById('toast-msg');
        function showToast(msg) {
            toastMsg.textContent = msg;
            toastEl.classList.remove('translate-y-20','opacity-0');
            setTimeout(() => toastEl.classList.add('translate-y-20','opacity-0'), 2500);
        }

        // --- Copy Key ---
        function copyKey(text) {
            navigator.clipboard.writeText(text).then(() => showToast("Скопирован: " + text));
        }

        // --- Search Filter ---
        function filterKeys() {
            const filter = document.getElementById('searchInput').value.toUpperCase();
            document.querySelectorAll('#keysBody tr').forEach(tr => {
                const keyText = tr.cells[1].innerText.toUpperCase();
                const hwidText = tr.cells[4].innerText.toUpperCase();
                tr.style.display = (keyText.includes(filter) || hwidText.includes(filter)) ? '' : 'none';
            });
        }

        // --- Init ---
        loadKeys();
        setInterval(loadKeys, 10000);
    </script>
</body>
</html>
